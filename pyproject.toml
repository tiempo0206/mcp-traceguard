[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-traceguard"
version = "0.1.0"
description = "Deterministic capability-contract testing for MCP servers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "tiempo0206" }]
dependencies = [
  "mcp>=2.2,<3",
  "pydantic>=2.11,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[project.scripts]
mcp-traceguard = "mcp_traceguard.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_traceguard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

