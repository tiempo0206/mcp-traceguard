name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest
      - run: mcp-traceguard export-schemas --output-dir /tmp/schemas
      - name: End-to-end CLI smoke test
        run: |
          mcp-traceguard snapshot \
            --output /tmp/baseline.json \
            -- python examples/demo_server.py
          mcp-traceguard check \
            --baseline /tmp/baseline.json \
            --policy examples/traceguard.policy.json \
            --report /tmp/report.json \
            -- python examples/demo_server.py
          if mcp-traceguard check \
            --baseline /tmp/baseline.json \
            --policy examples/traceguard.policy.json \
            --report /tmp/drift-report.json \
            -- python examples/drifted_server.py; then
            echo "expected the drifted server check to fail"
            exit 1
          fi
          mcp-traceguard call \
            --tool read_profile \
            --arguments '{"user_id":"ci-demo"}' \
            --policy examples/runtime.policy.json \
            --trace /tmp/profile.trace.json \
            -- python examples/runtime_server.py
          mcp-traceguard verify-trace /tmp/profile.trace.json
          mcp-traceguard replay \
            --suite scenarios/runtime-security.json \
            --policy examples/runtime.policy.json \
            --output /tmp/runtime-security.report.json \
            --trace-dir /tmp/runtime-security-traces \
            -- python examples/runtime_server.py
          mcp-traceguard sarif \
            --report /tmp/drift-report.json \
            --output /tmp/traceguard.sarif \
            --artifact examples/drifted_server.py
      - name: Preserve TraceGuard SARIF example
        uses: actions/upload-artifact@v4
        with:
          name: traceguard-sarif
          path: /tmp/traceguard.sarif
